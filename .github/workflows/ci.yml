name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-static:
    name: Format & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Check code formatting (gofmt)
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files require gofmt:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run static analysis (go vet)
        run: go vet ./...

  unit-tests:
    name: Unit Tests (Offline)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run unit test suite
        run: go test -v ./... -count=1

  race-detector:
    name: Race Detector
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run test suite with -race
        run: go test -v -race ./... -count=1

  build-and-verify:
    name: Build & Package Verification
    needs: [format-static, unit-tests, race-detector]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build cross-platform binaries
        run: |
          mkdir -p dist
          for TARGET in "linux amd64" "linux arm64" "darwin amd64" "darwin arm64"; do
            set -- $TARGET
            OS=$1
            ARCH=$2
            BIN="agy-pool-${OS}-${ARCH}"
            echo "Building ${BIN}..."
            CGO_ENABLED=0 GOOS=${OS} GOARCH=${ARCH} go build -trimpath -ldflags="-s -w" -o "dist/${BIN}" ./cmd/agy-pool
            (cd dist && sha256sum "${BIN}" > "${BIN}.sha256")
          done

      - name: Build Debian packages
        run: |
          ./scripts/build-deb.sh amd64 0.1.0 dist/agy-pool-linux-amd64 dist
          ./scripts/build-deb.sh arm64 0.1.0 dist/agy-pool-linux-arm64 dist
          dpkg-deb -I dist/agy-pool_0.1.0_amd64.deb
          dpkg-deb -c dist/agy-pool_0.1.0_amd64.deb
          dpkg-deb -I dist/agy-pool_0.1.0_arm64.deb
          dpkg-deb -c dist/agy-pool_0.1.0_arm64.deb

      - name: Generate unified SHA256SUMS
        run: |
          cd dist
          sha256sum agy-pool-linux-amd64 agy-pool-linux-arm64 agy-pool-darwin-amd64 agy-pool-darwin-arm64 agy-pool_*_amd64.deb agy-pool_*_arm64.deb > SHA256SUMS
          cat SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Verify native linux-amd64 binary execution
        run: |
          chmod +x dist/agy-pool-linux-amd64

          echo "=== Testing --version ==="
          dist/agy-pool-linux-amd64 --version

          echo "=== Testing --help ==="
          dist/agy-pool-linux-amd64 --help

          echo "=== Testing rejection of removed daemon-run ==="
          set +e
          dist/agy-pool-linux-amd64 daemon-run
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 2 ]; then
            echo "Expected exit code 2, got $STATUS"
            exit 1
          fi
          echo "daemon-run correctly rejected with exit code 2"
