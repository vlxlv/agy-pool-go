name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-gate:
    name: Test & Parity Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Check code formatting (gofmt)
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files require gofmt:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run static analysis (go vet)
        run: go vet ./...

      - name: Run unit tests (Offline)
        run: go test -v ./... -count=1

      - name: Run race detector
        run: go test -v -race ./... -count=1

  publish-release:
    name: Build, Package & Publish GitHub Release
    needs: test-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build cross-platform release binaries
        run: |
          mkdir -p dist
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$TAG_VERSION" ] || [ "$GITHUB_REF_NAME" = "main" ]; then
            TAG_VERSION="0.1.0"
          fi
          for TARGET in "linux amd64" "linux arm64" "darwin amd64" "darwin arm64"; do
            set -- $TARGET
            OS=$1
            ARCH=$2
            BIN="agy-pool-${OS}-${ARCH}"
            echo "Building ${BIN} with injected version: ${TAG_VERSION}"
            CGO_ENABLED=0 GOOS=${OS} GOARCH=${ARCH} go build -trimpath -ldflags="-s -w -X github.com/vlxlv/agy-pool-go/internal/config.Version=${TAG_VERSION}" -o "dist/${BIN}" ./cmd/agy-pool
            (cd dist && sha256sum "${BIN}" > "${BIN}.sha256")
          done

      - name: Build Debian packages
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$TAG_VERSION" ] || [ "$GITHUB_REF_NAME" = "main" ]; then
            TAG_VERSION="0.1.0"
          fi
          ./scripts/build-deb.sh amd64 "$TAG_VERSION" dist/agy-pool-linux-amd64 dist
          ./scripts/build-deb.sh arm64 "$TAG_VERSION" dist/agy-pool-linux-arm64 dist

      - name: Generate and verify unified SHA256SUMS
        run: |
          cd dist
          sha256sum agy-pool-linux-amd64 agy-pool-linux-arm64 agy-pool-darwin-amd64 agy-pool-darwin-arm64 agy-pool_*_amd64.deb agy-pool_*_arm64.deb > SHA256SUMS
          cat SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Verify native linux-amd64 binary
        run: |
          chmod +x dist/agy-pool-linux-amd64
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          echo "=== Testing --version ==="
          OUTPUT=$(dist/agy-pool-linux-amd64 --version)
          echo "$OUTPUT"

          if [ -n "$TAG_VERSION" ] && [ "$GITHUB_REF_NAME" != "main" ]; then
            if ! echo "$OUTPUT" | grep -q "$TAG_VERSION"; then
              echo "Error: expected version output to contain '$TAG_VERSION', got '$OUTPUT'"
              exit 1
            fi
          fi

          echo "=== Testing --help ==="
          dist/agy-pool-linux-amd64 --help

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          generate_release_notes: true
          files: |
            dist/agy-pool-linux-amd64
            dist/agy-pool-linux-arm64
            dist/agy-pool-darwin-amd64
            dist/agy-pool-darwin-arm64
            dist/*.deb
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
